<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Hồ Sơ - Tử Vi Vận Mệnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/" id="navbar-brand">
                <i class="bi bi-stars"></i>
                Tử Vi Vận Mệnh
            </a>
        </div>
    </nav>

    <main class="container my-4">
        <section id="user-form-screen">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center welcome-header mb-4">
                        <h1 class="display-5">Tạo Hồ Sơ Của Bạn</h1>
                        <p class="lead">
                            Nhập thông tin chính xác của bạn để bắt đầu hành trình khám phá vận mệnh.
                        </p>
                    </div>

                    <div class="card form-card shadow">
                        <div class="card-body p-4 p-md-5">
                            <form id="create-user-form">
                                <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

                                <!-- Avatar Upload Section -->
                                <div class="avatar-upload-section mb-4">
                                    <div class="avatar-preview-wrapper" id="avatar-preview-wrapper">
                                        <div class="avatar-preview" id="avatar-preview">
                                            <i class="bi bi-person-fill avatar-placeholder-icon" id="avatar-placeholder-icon"></i>
                                            <img id="avatar-preview-img" src="" alt="Avatar" class="d-none" />
                                        </div>
                                        <button type="button" class="avatar-edit-btn" id="avatar-edit-btn" title="Chọn ảnh">
                                            <i class="bi bi-camera-fill"></i>
                                        </button>
                                        <button type="button" class="avatar-remove-btn d-none" id="avatar-remove-btn" title="Xóa ảnh">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </div>
                                    <p class="avatar-hint">Ảnh đại diện (tùy chọn)</p>
                                    <input type="file" id="avatar-file-input" accept="image/*" class="d-none" />
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Họ và tên" required />
                                            <label for="full_name">Họ và tên</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <div class="form-floating">
                                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required />
                                            <label for="email">Email</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 mb-4">
                                        <div class="form-floating">
                                            <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu (Tùy chọn)" />
                                            <label for="password">Mật khẩu (Tùy chọn, mặc định: 123456)</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                     <div class="col-md-6 mb-4">
                                        <div class="form-floating">
                                            <input type="date" class="form-control" id="birthday" name="birthday" required />
                                            <label for="birthday">Ngày sinh (Dương lịch)</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                         <div class="form-floating">
                                            <input type="time" class="form-control" id="birth_time" name="birth_time" required />
                                            <label for="birth_time">Giờ sinh</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <h6 class="form-label">Giới tính</h6>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="male" value="Nam" checked />
                                        <label class="form-check-label" for="male">Nam</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="female" value="Nữ" />
                                        <label class="form-check-label" for="female">Nữ</label>
                                    </div>
                                </div>
                                <div class="d-grid gap-2">
                                    <button id="submit-button" type="submit" class="btn btn-primary btn-lg">
                                        <span id="submit-button-text">Tạo Hồ Sơ</span>
                                        <div id="submit-spinner" class="spinner-border spinner-border-sm d-none" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </button>
                                </div>

                                <div class="text-center mt-4 pt-3 border-top border-secondary">
                                    <span class="text-light me-2">Bạn đã có tài khoản?</span>
                                    <button type="button" class="btn btn-outline-warning rounded-pill px-4" id="btn-show-login">
                                        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập Ngay
                                    </button>
                                </div>
                            </form>

                            <!-- Login Form Section (Hidden by default) -->
                            <div id="login-form-container" class="d-none">
                                <h3 class="text-center text-warning mb-4"><i class="bi bi-shield-lock me-2"></i>Đăng Nhập Tài Khoản</h3>
                                <form id="login-user-form">
                                    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                                    <div class="form-floating mb-4">
                                        <input type="email" class="form-control" id="login-email" required placeholder="name@example.com" />
                                        <label for="login-email">Email đăng nhập</label>
                                    </div>
                                    <div class="form-floating mb-4">
                                        <input type="password" class="form-control" id="login-password" required placeholder="Mật khẩu" />
                                        <label for="login-password">Mật khẩu</label>
                                    </div>
                                    <div class="d-grid gap-2 mb-3">
                                        <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark rounded-pill">
                                            <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP
                                        </button>
                                    </div>
                                    <div class="text-center mt-3">
                                        <span class="text-light me-2">Chưa có tài khoản?</span>
                                        <button type="button" class="btn btn-link text-warning p-0 text-decoration-none fw-bold" id="btn-show-create">
                                            Tạo Hồ Sơ Mới
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span>&copy; <script>document.write(new Date().getFullYear())</script> Tử Vi Vận Mệnh. All Rights Reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="create-user.js"></script>
</body>

</html>
